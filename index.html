<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Apps" />
  <title>My Apps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/hub-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --accent:  #22c55e;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      max-width: 430px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    header {
      margin-bottom: 36px;
    }

    .hub-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .hub-title span {
      color: var(--accent);
    }

    .hub-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    .app-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #162032;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 17px;
      font-weight: 700;
    }

    .app-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .app-arrow {
      color: var(--muted);
      flex-shrink: 0;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    footer strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="hub-title">My <span>Apps</span></div>
      <div class="hub-sub">Your personal pocket tools</div>
    </header>

    <div class="app-grid">
      <a class="app-card" href="./habit-tracker/">
        <div class="app-icon">✅</div>
        <div class="app-info">
          <div class="app-name">Habit Tracker</div>
          <div class="app-desc">Log daily habits. GitHub-style monthly chart with streak tracking and reminders.</div>
        </div>
        <svg class="app-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>

    <footer>
      <p><strong>Tip:</strong> Add this page to your home screen<br/>to use as your personal app launcher.</p>
      <p style="margin-top:8px; font-size:11px">iOS: Safari → Share → Add to Home Screen<br/>Android: Chrome → ⋮ → Add to Home Screen</p>
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
