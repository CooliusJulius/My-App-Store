<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Apps" />
  <title>My Apps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0f172a; color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; min-height: 100%;
    }
    .wrap { max-width: 430px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-size: 30px; font-weight: 800; }
    h1 span { color: #22c55e; }
    .sub { font-size: 14px; color: #94a3b8; margin-top: 6px; margin-bottom: 36px; }
    .app-card {
      display: flex; align-items: center; gap: 16px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; padding: 16px;
      text-decoration: none; color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .15s, transform .1s;
      margin-bottom: 12px;
    }
    .app-card:active { transform: scale(.98); border-color: #22c55e; }
    .app-icon {
      width: 56px; height: 56px; border-radius: 12px;
      background: #162032; display: flex; align-items: center;
      justify-content: center; font-size: 28px; flex-shrink: 0;
    }
    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 17px; font-weight: 700; }
    .app-desc { font-size: 13px; color: #94a3b8; margin-top: 3px; line-height: 1.4; }
    .arrow { color: #94a3b8; flex-shrink: 0; }
    footer { margin-top: 48px; text-align: center; font-size: 12px; color: #64748b; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>My <span>Apps</span></h1>
    <p class="sub">Your personal pocket tools</p>

    <a class="app-card" href="./habit-tracker/">
      <div class="app-icon">✅</div>
      <div class="app-info">
        <div class="app-name">Habit Tracker</div>
        <div class="app-desc">Log daily habits. Calendar view with history and streak tracking.</div>
      </div>
      <svg class="arrow" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <footer>
      Add this page to your home screen to use as your personal launcher.<br>
      iOS: Safari → Share → Add to Home Screen<br>
      Android: Chrome → ⋮ → Add to Home Screen
    </footer>
  </div>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
